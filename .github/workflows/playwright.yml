name: Automated Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Frontend / Test Repo
      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      # 2. Checkout Backend Repo
      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: siphoPrince/cylo_backend
          path: backend

      # 3. Setup Runtimes
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 4. Install Dependencies
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps

      # 5. Spin up SQL Server Container & Pre-create Database
      - name: Start SQL Server
        run: |
          docker run -d --name mssql \
            -e "ACCEPT_EULA=Y" \
            -e "MSSQL_SA_PASSWORD=YourPassword123!" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          
          # Give MSSQL 15 seconds to complete engine startup
          sleep 15

          # Pre-create UsersDb so EF Core doesn't throw Error 4060 on startup
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "YourPassword123!" -C \
            -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'UsersDb') CREATE DATABASE UsersDb;"

      # 6. Start Backend API (in background)
      - name: Start C# Backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5000
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=UsersDb;User Id=sa;Password=YourPassword123!;TrustServerCertificate=True;Encrypt=False;"
        run: |
          cd backend
          dotnet build
          nohup dotnet run --no-build --no-launch-profile > backend.log 2>&1 &

      # 7. Start Frontend App (in background)
      - name: Start Frontend
        run: |
          cd frontend
          npm run build
          nohup npm run preview -- --port 51817 > frontend.log 2>&1 &

      # 8. Wait for both servers to accept connections
      - name: Wait for localhost ports
        run: |
          npx wait-on http://localhost:5000 http://localhost:51817 --timeout 60000

      # 9. Run Playwright Tests
      - name: Execute Playwright Tests
        run: |
          cd frontend
          npx playwright test ./tests/login.spec.js

      # 10. Output logs if ANY prior step fails
      - name: Output Backend Crash Log
        if: failure()
        run: |
          echo "================ C# BACKEND LOGS ================"
          cat backend/backend.log || true
          echo "================================================="